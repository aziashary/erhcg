<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Dashboard | Rockshill</title>
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link rel="stylesheet" href="layout.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1>Rockshill<span>.</span></h1>
        <p>Login ke Admin Dashboard</p>
      </div>
      
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="form-control" placeholder="admin@rockshill.com" required value="admin@rockshill.com">
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Masukkan password" required value="admin123">
        </div>
        
        <div class="form-group">
          <label for="role">Role Admin (Mock)</label>
          <select id="role" class="form-control" required>
            <option value="superadmin">Super Admin</option>
            <option value="reservation">Admin Reservasi</option>
            <option value="staff">Staff Lapangan</option>
          </select>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 30px;">Login</button>
      </form>
      
      <div style="text-align: center; margin-top: 20px;">
        <a href="/" style="color: var(--color-gray-600); text-decoration: none; font-size: 0.9rem;">
          <i class='bx bx-arrow-back'></i> Kembali ke Website
        </a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btnSubmit = document.querySelector('button[type="submit"]');
      
      btnSubmit.innerHTML = 'Loading...';
      btnSubmit.disabled = true;

      fetch('http://localhost:8000/api/admin/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify({ email, password })
      })
      .then(response => response.json())
      .then(data => {
        btnSubmit.innerHTML = 'Login';
        btnSubmit.disabled = false;

        if (data.success) {
          const userSession = {
            isLoggedIn: true,
            token: data.token,
            role: data.user.role,
            name: data.user.name,
            email: data.user.email
          };
          localStorage.setItem('erhcg_admin_session', JSON.stringify(userSession));
          window.location.href = 'index.html';
        } else {
          alert('Login gagal: ' + data.message);
        }
      })
      .catch(error => {
        btnSubmit.innerHTML = 'Login';
        btnSubmit.disabled = false;
        console.error('Error:', error);
        alert('Terjadi kesalahan koneksi.');
      });
    });
    
    // Auto redirect if already logged in
    const session = JSON.parse(localStorage.getItem('erhcg_admin_session'));
    if (session && session.isLoggedIn && session.token) {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
